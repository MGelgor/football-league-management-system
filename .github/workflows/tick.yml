# Yedek: sunucu kendini KeepAwakeJob ile uyanık tutar; bir sebeple uyuduysa bu iş uyandırır ve kaçırılan
# maç günleri sırayla oynanır. GitHub zamanlanmış işleri saatlerce geciktirebilir; depo 60 gün hareketsiz
# kalırsa durdurur.
name: Zamanlayıcı

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      # Uyuyan sunucunun açılması bir dakikayı bulabilir
      - run: curl -fsS --retry 4 --retry-delay 30 --retry-all-errors --max-time 120 "${{ vars.API_URL }}/internal/tick"
