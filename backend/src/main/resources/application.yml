spring:
  application:
    name: football-league-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/football_league
    username: football_league
    password: football_league
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      # JSON yedek dosyaları büyük olabilir; logo için 300 KB sınırı FileStorageService'te
      max-file-size: 200MB
      max-request-size: 200MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  upload-dir: ./uploads
  save-dir: ./saves
  rooms:
    # true: her /api isteği bir odaya ait olmalı (yayında tek kişilik lig kapanır)
    required: false
    max-rooms: 30
    max-members: 8
    # Zamanı gelen maç günlerini her dakika işleyen iş (testlerde kapalı)
    scheduler-enabled: true
  cors:
    # Virgülle ayrılmış kökenler; boşsa CORS kapalı (geliştirmede Vite proxy aynı kökenden gönderir)
    allowed-origins: ""
