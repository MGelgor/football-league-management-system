spring:
  application:
    name: football-league-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/football_league
    username: football_league
    password: football_league
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  upload-dir: ./uploads
