# Yayın (Render): veritabanı bilgileri ortam değişkenlerinden gelir (render.yaml, fromDatabase).
# Neon gibi dış veritabanları SSL ister: DB_SSLMODE=require.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      # Boşta bağlantı tutulmaz, canlı tutma sorgusu yok: Neon 5 dk sorgu gelmezse uyur (ücretsiz işlem süresi)
      minimum-idle: 0
      idle-timeout: 60000
      keepalive-time: 0
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}

app:
  rooms:
    required: true
  cors:
    allowed-origins: ${CORS_ORIGINS:https://mgelgor.github.io}
