# Yayın (Render): veritabanı bilgileri ortam değişkenlerinden gelir (render.yaml, fromDatabase).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}

app:
  rooms:
    required: true
  cors:
    allowed-origins: ${CORS_ORIGINS:https://mgelgor.github.io}
