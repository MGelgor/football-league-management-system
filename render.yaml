# Render Blueprint: backend (Docker). Veritabanı Neon'da (27 Ekim 2026'da Render Postgres'ten taşındı).
services:
  - type: web
    name: futbol-ligi-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Veritabanı Neon'da (Frankfurt, doğrudan uç nokta: oda şemaları bağlantı başına ayarlandığı için
      # havuzlayıcı "-pooler" adresi kullanılmaz). Parola gizli: Render panelinden girilir.
      - key: DB_HOST
        value: ep-purple-water-bax1zffl.c-8.eu-central-1.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: neondb
      - key: DB_USER
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: CORS_ORIGINS
        value: https://mgelgor.github.io

# Eski Render veritabanı: 21 Kasım 2026'da sona erer; artık kullanılmıyor.
databases:
  - name: futbol-ligi-db
    plan: free
    region: frankfurt
    databaseName: futbol_ligi
    user: futbol_ligi
    postgresMajorVersion: "16"
