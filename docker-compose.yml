services:
  postgres:
    image: postgres:16
    container_name: football-league-postgres
    environment:
      POSTGRES_DB: football_league
      POSTGRES_USER: football_league
      POSTGRES_PASSWORD: football_league
    ports:
      - "5432:5432"
    volumes:
      - football-league-pgdata:/var/lib/postgresql/data

volumes:
  football-league-pgdata:
